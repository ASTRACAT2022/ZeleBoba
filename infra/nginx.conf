events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  server_tokens off;
  # The published port is loopback-only. These are host/bridge ranges, not public clients.
  # The TLS proxy must overwrite X-Real-IP; never publish this HTTP listener directly.
  set_real_ip_from 127.0.0.1;
  set_real_ip_from ::1;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from 10.0.0.0/8;
  real_ip_header X-Real-IP;
  map $http_x_forwarded_proto $billing_https { default off; https on; }
  # Never log URLs, query strings, cookie values, or Telegram login tokens.
  log_format minimal '$time_iso8601 $request_method $status $request_time';
  access_log /dev/stdout minimal;
  limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
  server {
    listen 80;
    root /app/public;
    client_max_body_size 64k;
    location / { limit_req zone=general burst=30 nodelay; try_files $uri /index.php$is_args$args; }
    location = /index.php { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /app/public/index.php; fastcgi_param HTTPS $billing_https; fastcgi_pass app:9000; }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
  }
}
