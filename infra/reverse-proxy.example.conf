# Install on your TLS-terminating Nginx host, replace domain and certificate paths.
server {
    listen 443 ssl;
    server_name cabinet.example.com;
    ssl_certificate /etc/letsencrypt/live/cabinet.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cabinet.example.com/privkey.pem;
    client_max_body_size 64k;
    # Do not log login URLs or sensitive request bodies.
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
server {
    listen 80;
    server_name cabinet.example.com;
    return 301 https://cabinet.example.com$request_uri;
}
