services:
  app:
    build: .
    env_file: .env
    restart: unless-stopped
    volumes: ["laravel-storage:/app/storage"]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "artisan", "about", "--only=environment"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits: { memory: 512M }
  horizon:
    build: .
    env_file: .env
    command: ["php", "artisan", "horizon"]
    restart: unless-stopped
    volumes: ["laravel-storage:/app/storage"]
    depends_on:
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    deploy:
      resources:
        limits: { memory: 512M }
  scheduler:
    build: .
    env_file: .env
    command: ["php", "artisan", "schedule:work"]
    restart: unless-stopped
    volumes: ["laravel-storage:/app/storage"]
    depends_on:
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    deploy:
      resources:
        limits: { memory: 256M }
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    restart: unless-stopped
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { memory: 256M }
  web:
    image: nginx:1.28-bookworm
    ports: ["127.0.0.1:${LARAVEL_HTTP_PORT:-8081}:80"]
    volumes:
      - "./public:/app/public:ro"
      - "./infra/nginx.conf:/etc/nginx/nginx.conf:ro"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { memory: 128M }
volumes:
  laravel-storage:
  redis-data:
