services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zeleboba
      POSTGRES_USER: zeleboba
      POSTGRES_PASSWORD: e2e-only-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zeleboba -d zeleboba"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - "./migrations:/docker-entrypoint-initdb.d/migrations:ro"
      - "./laravel/e2e/000_init.sql:/docker-entrypoint-initdb.d/000_init.sql:ro"
      - "./laravel/e2e/999_seed.sql:/docker-entrypoint-initdb.d/999_seed.sql:ro"

  app:
    build: ./laravel
    environment: &app-env
      APP_NAME: ZeleBoba-E2E
      APP_ENV: testing
      APP_KEY: base64:2wK6p5Xv7kFlxCdwX7ptlGOdmCGAT8mUUAk/OwpWMJI=
      APP_DEBUG: "false"
      APP_URL: http://web
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: zeleboba
      DB_USERNAME: zeleboba
      DB_PASSWORD: e2e-only-password
      DB_SSLMODE: disable
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      PAYMENT_DRIVER: demo
      PROVISION_DRIVER: demo
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:1.28-bookworm
    volumes:
      - "./laravel/public:/app/public:ro"
      - "./laravel/infra/nginx.conf:/etc/nginx/nginx.conf:ro"
    depends_on: [app]

  e2e:
    image: curlimages/curl:8.18.0
    volumes:
      - "./laravel/e2e/http.sh:/e2e/http.sh:ro"
    entrypoint: ["/bin/sh", "/e2e/http.sh"]
    depends_on: [web]
