name: zeleboba

x-ruby-app: &ruby-app
  build: .
  environment:
    APP_ENV: ${APP_ENV:-prod}
    APP_URL: ${APP_URL:?Set APP_URL in .env}
    DATABASE_DSN: pgsql:host=db;port=5432;dbname=billing
    DATABASE_USER: billing
    DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped
  init: true
  volumes:
    - app-secrets:/app/var
  security_opt:
    - no-new-privileges:true

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: billing
      POSTGRES_USER: billing_owner
      POSTGRES_PASSWORD: ${DATABASE_MIGRATION_PASSWORD:?Set DATABASE_MIGRATION_PASSWORD in .env}
      BILLING_RUNTIME_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing_owner -d billing"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *ruby-app
    profiles: [maintenance]
    restart: "no"
    environment:
      APP_ENV: ${APP_ENV:-prod}
      APP_URL: ${APP_URL:?Set APP_URL in .env}
      DATABASE_DSN: pgsql:host=db;port=5432;dbname=billing
      DATABASE_USER: billing_owner
      DATABASE_PASSWORD: ${DATABASE_MIGRATION_PASSWORD:?Set DATABASE_MIGRATION_PASSWORD in .env}
    command: ["ruby", "bin/console-ruby", "db:migrate"]

  app:
    <<: *ruby-app
    ports:
      - "127.0.0.1:${BILLING_HTTP_PORT:-9292}:9292"
    command: ["bundle", "exec", "rackup", "--host", "0.0.0.0", "--port", "9292", "config.ru"]

  worker:
    <<: *ruby-app
    command: ["ruby", "bin/worker-ruby"]

  scheduler:
    <<: *ruby-app
    command: ["ruby", "bin/scheduler-ruby"]

volumes:
  postgres:
  app-secrets:
