name: billing
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_DB: billing_test, POSTGRES_USER: billing, POSTGRES_PASSWORD: test-only}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U billing -d billing_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.4', extensions: 'pdo_sqlite, pdo_pgsql, mbstring, pcntl, sodium', coverage: none}
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: find src public tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: composer test
        env:
          TEST_POSTGRES_DSN: pgsql:host=127.0.0.1;port=5432;dbname=billing_test
          TEST_POSTGRES_USER: billing
          TEST_POSTGRES_PASSWORD: test-only
      - run: composer audit
      - run: docker build -t billing-ci .
  rails-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.5'
      - run: sudo apt-get update && sudo apt-get install -y libargon2-dev libpq-dev libsodium-dev pkg-config
      - run: gem install bundler -v 4.0.11 --no-document
      - run: bundle install --jobs 4 --retry 3
        working-directory: rails_backend
      - run: bundle exec rails zeitwerk:check
        working-directory: rails_backend
        env: {RAILS_ENV: test}
      - run: bundle exec rails routes > /tmp/zeleboba-rails-routes.txt
        working-directory: rails_backend
        env: {RAILS_ENV: test}
      - run: docker build -f rails_backend/Dockerfile -t billing-rails-ci .
