name: billing

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: ruby -Itest test/ruby_port_test.rb
      - run: scripts/e2e_ruby.sh
      - run: docker build -t zeleboba-ruby-ci .
